<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>MMK-CAPTION</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Noto+Sans:wght@400;600;700;800;900&family=Noto+Sans+Thai:wght@400;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #111111;
      --ink: #f8f4e8;
      --muted: #beb7a7;
      --panel: #fff1c7;
      --panel-2: #f7f7f7;
      --black: #111111;
      --pink: #ff4da6;
      --yellow: #ffe100;
      --cyan: #43e8ff;
      --green: #74ff8b;
      --purple: #a777ff;
      --red: #ff5a5f;
      --shadow: 6px 6px 0 #000;
      --shadow-sm: 4px 4px 0 #000;
      --radius: 22px;
      --radius-sm: 14px;
      --font-ui: 'Noto Sans', 'Noto Sans Thai', system-ui, sans-serif;
      --font-display: 'Archivo Black', 'Noto Sans Thai', sans-serif;
    }

    [data-theme="light"] {
      --bg: #ffe8f3;
      --ink: #111111;
      --muted: #4e4e4e;
      --panel: #fff8d7;
      --panel-2: #ffffff;
      --shadow: 6px 6px 0 #111;
      --shadow-sm: 4px 4px 0 #111;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      min-height: 100dvh;
      font-family: var(--font-ui);
      color: var(--ink);
      background:
        radial-gradient(circle at 16% 8%, rgba(255,77,166,.32), transparent 26%),
        radial-gradient(circle at 88% 18%, rgba(67,232,255,.26), transparent 30%),
        linear-gradient(135deg, var(--bg), #171717 58%, #261327);
      line-height: 1.45;
      overflow-x: hidden;
    }
    [data-theme="light"] body {
      background:
        radial-gradient(circle at 16% 8%, rgba(255,77,166,.35), transparent 26%),
        radial-gradient(circle at 88% 18%, rgba(67,232,255,.45), transparent 30%),
        linear-gradient(135deg, #ffe8f3, #fff7c2 58%, #e7faff);
    }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; }
    img { max-width: 100%; display: block; }
    :focus-visible { outline: 4px solid var(--cyan); outline-offset: 3px; }

    .page {
      width: min(100%, 520px);
      min-height: 100dvh;
      margin: 0 auto;
      padding: 14px 14px 34px;
      position: relative;
    }

    .page::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .28;
      background-image:
        linear-gradient(var(--ink) 1px, transparent 1px),
        linear-gradient(90deg, var(--ink) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: linear-gradient(to bottom, #000, transparent 70%);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0 16px;
      position: relative;
      z-index: 1;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-mark {
      width: 48px;
      height: 48px;
      border: 3px solid var(--black);
      border-radius: 16px;
      background: var(--yellow);
      color: var(--black);
      box-shadow: var(--shadow-sm);
      display: grid;
      place-items: center;
      font-family: var(--font-display);
      font-size: 20px;
      transform: rotate(-3deg);
    }
    .brand-title {
      font-family: var(--font-display);
      font-size: clamp(22px, 7vw, 34px);
      letter-spacing: -1.5px;
      line-height: .9;
      text-transform: uppercase;
      text-shadow: 3px 3px 0 #000;
    }
    [data-theme="light"] .brand-title { text-shadow: 3px 3px 0 #fff; }
    .theme-toggle {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border: 3px solid var(--black);
      border-radius: 15px;
      background: var(--cyan);
      color: var(--black);
      box-shadow: var(--shadow-sm);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .theme-toggle:active { transform: translate(3px,3px); box-shadow: 1px 1px 0 #000; }

    .hero {
      position: relative;
      z-index: 1;
      border: 3px solid var(--black);
      border-radius: 28px;
      background: var(--panel);
      color: var(--black);
      box-shadow: var(--shadow);
      padding: 18px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .hero::after {
      content: 'SOCIAL MODE';
      position: absolute;
      right: -34px;
      top: 24px;
      rotate: 18deg;
      font-family: var(--font-display);
      font-size: 18px;
      background: var(--pink);
      border: 3px solid var(--black);
      padding: 8px 28px;
      color: #fff;
    }
    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 3px solid var(--black);
      border-radius: 999px;
      background: var(--green);
      color: var(--black);
      padding: 6px 10px;
      box-shadow: 3px 3px 0 #000;
      font-weight: 900;
      font-size: 12px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .hero h1 {
      font-family: var(--font-display);
      font-size: clamp(34px, 11vw, 56px);
      line-height: .88;
      letter-spacing: -2px;
      max-width: 9ch;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .hero p {
      max-width: 32ch;
      font-weight: 800;
      color: #2a2a2a;
      font-size: 14px;
    }

    .card {
      position: relative;
      z-index: 1;
      border: 3px solid var(--black);
      border-radius: var(--radius);
      background: var(--panel-2);
      color: var(--black);
      box-shadow: var(--shadow);
      padding: 14px;
      margin-bottom: 16px;
    }
    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: -.2px;
      font-size: 14px;
    }
    .section-title span:last-child {
      background: var(--yellow);
      border: 2px solid var(--black);
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 11px;
      box-shadow: 2px 2px 0 #000;
      white-space: nowrap;
    }

    .upload-zone {
      min-height: 188px;
      border: 3px dashed var(--black);
      border-radius: 20px;
      background:
        linear-gradient(135deg, rgba(255,225,0,.5), rgba(67,232,255,.36)),
        #fff;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 22px;
      position: relative;
      overflow: hidden;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }
    .upload-zone.drag-over, .upload-zone:hover {
      transform: translate(-2px,-2px);
      box-shadow: var(--shadow-sm);
      background:
        linear-gradient(135deg, rgba(255,77,166,.35), rgba(116,255,139,.4)),
        #fff;
    }
    .upload-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .upload-badge {
      width: 64px;
      height: 64px;
      margin: 0 auto 12px;
      display: grid;
      place-items: center;
      border: 3px solid var(--black);
      border-radius: 22px;
      background: var(--pink);
      color: #fff;
      box-shadow: var(--shadow-sm);
      transform: rotate(4deg);
    }
    .upload-main { font-family: var(--font-display); font-size: 22px; line-height: 1; margin-bottom: 6px; }
    .upload-sub { font-weight: 800; font-size: 12px; color: #555; }

    .preview-wrap { display: none; position: relative; overflow: hidden; border: 3px solid var(--black); border-radius: 20px; box-shadow: var(--shadow-sm); }
    .preview-wrap.visible { display: block; }
    .preview-img { width: 100%; max-height: 330px; object-fit: cover; background: #ddd; }
    .preview-remove {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border: 3px solid var(--black);
      border-radius: 14px;
      background: var(--red);
      color: #fff;
      box-shadow: 3px 3px 0 #000;
    }

    .lang-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .lang-btn {
      min-height: 68px;
      border: 3px solid var(--black);
      border-radius: 16px;
      background: #fff;
      color: var(--black);
      box-shadow: 3px 3px 0 #000;
      font-weight: 950;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }
    .lang-btn:active { transform: translate(3px,3px); box-shadow: 1px 1px 0 #000; }
    .lang-btn.active { background: var(--cyan); transform: translate(-1px,-1px); box-shadow: 5px 5px 0 #000; }
    .lang-flag { display: block; font-size: 24px; line-height: 1; margin-bottom: 4px; }
    .lang-code { display: block; font-family: 'Space Grotesk', var(--font-ui); font-size: 12px; }

    .btn-generate {
      position: sticky;
      bottom: 12px;
      z-index: 5;
      width: 100%;
      min-height: 60px;
      border: 3px solid var(--black);
      border-radius: 20px;
      background: var(--pink);
      color: #fff;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-family: var(--font-display);
      font-size: 19px;
      text-transform: uppercase;
      margin-bottom: 16px;
      transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
    }
    .btn-generate:not(:disabled):active { transform: translate(5px,5px); box-shadow: 1px 1px 0 #000; }
    .btn-generate:disabled { opacity: .55; cursor: not-allowed; filter: grayscale(.35); }

    .results-card { padding: 0; overflow: hidden; }
    .results-head {
      padding: 14px;
      border-bottom: 3px solid var(--black);
      background: var(--yellow);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .results-title { font-family: var(--font-display); text-transform: uppercase; letter-spacing: -.7px; }
    .results-badge { font-size: 12px; font-weight: 950; background: #fff; border: 2px solid #000; border-radius: 999px; padding: 4px 8px; box-shadow: 2px 2px 0 #000; }

    .empty-state, .loading-state, .error-state { padding: 34px 16px; text-align: center; }
    .empty-state p, .loading-text { font-weight: 850; color: #444; }
    .empty-icon, .spinner {
      width: 58px;
      height: 58px;
      margin: 0 auto 14px;
      border: 3px solid #000;
      border-radius: 18px;
      background: var(--cyan);
      box-shadow: var(--shadow-sm);
      display: grid;
      place-items: center;
      font-size: 26px;
    }
    .loading-state { display: none; }
    .loading-state.visible { display: block; }
    .spinner { border-radius: 50%; border-top-color: var(--pink); animation: spin .8s linear infinite; }
    @keyframes spin { to { rotate: 360deg; } }
    .error-state { display: none; }
    .error-state.visible { display: block; }
    .error-msg { border: 3px solid #000; border-radius: 18px; background: #ffe0e0; box-shadow: var(--shadow-sm); padding: 14px; font-weight: 900; color: #9b1111; }

    .captions-list { display: none; flex-direction: column; gap: 12px; padding: 14px; }
    .captions-list.visible { display: flex; }
    .caption-item {
      display: grid;
      grid-template-columns: 34px 1fr 42px;
      gap: 10px;
      align-items: start;
      border: 3px solid var(--black);
      border-radius: 18px;
      background: #fff;
      box-shadow: var(--shadow-sm);
      padding: 12px;
      animation: pop .22s ease both;
    }
    .caption-item:nth-child(2n) { background: #f1fcff; }
    .caption-item:nth-child(3n) { background: #fff4fb; }
    .caption-number {
      width: 34px;
      height: 34px;
      border: 3px solid #000;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: var(--green);
      color: #000;
      font-family: var(--font-display);
      box-shadow: 2px 2px 0 #000;
    }
    .caption-text {
      font-size: 15px;
      font-weight: 800;
      line-height: 1.42;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }
    .caption-tag {
      display: inline-block;
      margin-bottom: 7px;
      border: 2px solid #000;
      border-radius: 999px;
      padding: 2px 7px;
      background: var(--yellow);
      font-size: 10px;
      font-weight: 950;
      text-transform: uppercase;
      box-shadow: 2px 2px 0 #000;
    }
    .copy-btn {
      width: 42px;
      height: 42px;
      border: 3px solid #000;
      border-radius: 14px;
      background: var(--purple);
      color: #fff;
      box-shadow: 3px 3px 0 #000;
      display: grid;
      place-items: center;
    }
    .copy-btn.copied { background: var(--green); color: #000; }
    @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }

    .note {
      margin-top: 10px;
      border: 3px solid #000;
      border-radius: 18px;
      background: #eafff0;
      color: #111;
      box-shadow: var(--shadow-sm);
      padding: 10px 12px;
      font-size: 12px;
      font-weight: 850;
    }
    .footer { position: relative; z-index: 1; padding: 10px 4px 0; text-align: center; color: var(--muted); font-size: 12px; font-weight: 800; }
    .footer b { color: var(--ink); }

    @media (max-width: 380px) {
      .page { padding-inline: 10px; }
      .lang-grid { gap: 6px; }
      .lang-btn { min-height: 62px; border-width: 2px; }
      .lang-flag { font-size: 20px; }
      .caption-item { grid-template-columns: 30px 1fr; }
      .copy-btn { grid-column: 2; width: 100%; height: 38px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand" aria-label="MMK-CAPTION">
        <div class="brand-mark">M</div>
        <div class="brand-title">MMK<br>CAPTION</div>
      </div>
      <button class="theme-toggle" data-theme-toggle aria-label="Ganti mode terang atau gelap">☾</button>
    </header>

    <main>
      <section class="card">
        <div class="section-title"><strong>1. Upload Foto</strong><span>JPG / PNG / WEBP</span></div>
        <label class="upload-zone" id="uploadZone" for="fileInput">
          <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp" />
          <div>
            <div class="upload-badge" aria-hidden="true">
              <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.7"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            </div>
            <div class="upload-main">Tap / drop foto</div>
            <div class="upload-sub">Maksimal 10 MB. Foto tidak disimpan di browser.</div>
          </div>
        </label>
        <div class="preview-wrap" id="previewWrap">
          <img class="preview-img" id="previewImg" alt="Preview foto yang diupload" />
          <button class="preview-remove" id="removeBtn" aria-label="Hapus foto">✕</button>
        </div>
      </section>

      <section class="card">
        <div class="section-title"><strong>2. Pilih Bahasa</strong><span>Local style</span></div>
        <div class="lang-grid" role="group" aria-label="Pilih bahasa caption">
          <button class="lang-btn active" data-lang="ID" aria-pressed="true"><span class="lang-flag">🇮🇩</span><span class="lang-code">ID</span></button>
          <button class="lang-btn" data-lang="EN" aria-pressed="false"><span class="lang-flag">🇬🇧</span><span class="lang-code">EN</span></button>
          <button class="lang-btn" data-lang="MY" aria-pressed="false"><span class="lang-flag">🇲🇾</span><span class="lang-code">MY</span></button>
          <button class="lang-btn" data-lang="TH" aria-pressed="false"><span class="lang-flag">🇹🇭</span><span class="lang-code">TH</span></button>
          <button class="lang-btn" data-lang="VI" aria-pressed="false"><span class="lang-flag">🇻🇳</span><span class="lang-code">VI</span></button>
        </div>
        <div class="note">Output: 6 caption Gen-Z. Caption ke-6 otomatis pakai 3 hashtag relevan.</div>
      </section>

      <button class="btn-generate" id="generateBtn" disabled>
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.7"><path d="M13 2L3 14h8l-1 8 11-14h-8l0-6z"/></svg>
        Generate Caption
      </button>

      <section class="card results-card" aria-live="polite" aria-atomic="true">
        <div class="results-head">
          <div class="results-title">Hasil Caption</div>
          <div class="results-badge" id="resultsBadge">Ready</div>
        </div>

        <div class="empty-state" id="emptyState">
          <div class="empty-icon">📸</div>
          <p>Upload foto dulu, pilih bahasa, lalu tekan generate.</p>
        </div>

        <div class="loading-state" id="loadingState">
          <div class="spinner"></div>
          <div class="loading-text">Lagi bikin caption Gen-Z yang lebih hidup...</div>
        </div>

        <div class="error-state" id="errorState">
          <div class="error-msg" id="errorMsg"></div>
        </div>

        <div class="captions-list" id="captionsList"></div>
      </section>
    </main>

    <footer class="footer">Powered by <b>MMK-CAPTION</b> × Groq AI</footer>
  </div>

  <script>
    const API_ENDPOINT = '/.netlify/functions/generate';
    const LABELS = ['CAPTION', 'CAPTION', 'CAPTION', 'CAPTION', 'CAPTION', 'CAPTION + HASHTAG'];

    let selectedLang = 'ID';
    let imageBase64 = null;
    let imageType = 'image/jpeg';

    const root = document.documentElement;
    const themeToggle = document.querySelector('[data-theme-toggle]');
    const savedTheme = localStorage.getItem('mmk-theme') || 'dark';
    root.setAttribute('data-theme', savedTheme);
    themeToggle.textContent = savedTheme === 'dark' ? '☾' : '☀';
    themeToggle.addEventListener('click', () => {
      const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      localStorage.setItem('mmk-theme', next);
      themeToggle.textContent = next === 'dark' ? '☾' : '☀';
    });

    const fileInput = document.getElementById('fileInput');
    const uploadZone = document.getElementById('uploadZone');
    const previewWrap = document.getElementById('previewWrap');
    const previewImg = document.getElementById('previewImg');
    const removeBtn = document.getElementById('removeBtn');
    const generateBtn = document.getElementById('generateBtn');
    const captionsList = document.getElementById('captionsList');
    const loadingState = document.getElementById('loadingState');
    const emptyState = document.getElementById('emptyState');
    const errorState = document.getElementById('errorState');
    const errorMsg = document.getElementById('errorMsg');
    const resultsBadge = document.getElementById('resultsBadge');

    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) handleFile(file);
    });

    uploadZone.addEventListener('dragover', (event) => {
      event.preventDefault();
      uploadZone.classList.add('drag-over');
    });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
    uploadZone.addEventListener('drop', (event) => {
      event.preventDefault();
      uploadZone.classList.remove('drag-over');
      const file = event.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) handleFile(file);
    });

    function handleFile(file) {
      const allowed = ['image/jpeg', 'image/png', 'image/webp'];
      if (!allowed.includes(file.type)) {
        showError('Format belum didukung. Gunakan JPG, PNG, atau WEBP.');
        return;
      }
      if (file.size > 10 * 1024 * 1024) {
        showError('Ukuran file terlalu besar. Maksimal 10 MB.');
        return;
      }

      imageType = file.type;
      resizeImageForAnalysis(file)
        .then(({ dataUrl, base64, mimeType }) => {
          imageType = mimeType;
          imageBase64 = base64;
          previewImg.src = dataUrl;
          uploadZone.style.display = 'none';
          previewWrap.classList.add('visible');
          generateBtn.disabled = false;
          resetResults();
        })
        .catch(() => showError('Gagal memproses gambar. Coba upload foto lain.'));
    }

    function resizeImageForAnalysis(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = () => {
          const img = new Image();
          img.onerror = reject;
          img.onload = () => {
            const maxSide = 768;
            const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
            const width = Math.max(1, Math.round(img.width * scale));
            const height = Math.max(1, Math.round(img.height * scale));

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d', { alpha: false });
            ctx.drawImage(img, 0, 0, width, height);

            const mimeType = 'image/jpeg';
            const dataUrl = canvas.toDataURL(mimeType, 0.76);
            resolve({
              dataUrl,
              base64: dataUrl.split(',')[1],
              mimeType
            });
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    removeBtn.addEventListener('click', () => {
      imageBase64 = null;
      fileInput.value = '';
      previewImg.src = '';
      previewWrap.classList.remove('visible');
      uploadZone.style.display = '';
      generateBtn.disabled = true;
      resetResults();
    });

    document.querySelectorAll('.lang-btn').forEach((button) => {
      button.addEventListener('click', () => {
        document.querySelectorAll('.lang-btn').forEach((item) => {
          item.classList.remove('active');
          item.setAttribute('aria-pressed', 'false');
        });
        button.classList.add('active');
        button.setAttribute('aria-pressed', 'true');
        selectedLang = button.dataset.lang;
      });
    });

    function resetResults() {
      emptyState.style.display = 'block';
      loadingState.classList.remove('visible');
      errorState.classList.remove('visible');
      captionsList.classList.remove('visible');
      captionsList.innerHTML = '';
      resultsBadge.textContent = 'Ready';
    }

    function showError(message) {
      emptyState.style.display = 'none';
      loadingState.classList.remove('visible');
      captionsList.classList.remove('visible');
      errorMsg.textContent = message;
      errorState.classList.add('visible');
      resultsBadge.textContent = 'Error';
    }

    function showLoading() {
      emptyState.style.display = 'none';
      errorState.classList.remove('visible');
      captionsList.classList.remove('visible');
      loadingState.classList.add('visible');
      resultsBadge.textContent = 'Generating';
    }

    function showCaptions(captions) {
      loadingState.classList.remove('visible');
      emptyState.style.display = 'none';
      errorState.classList.remove('visible');
      captionsList.innerHTML = '';

      captions.forEach((caption, index) => {
        const item = document.createElement('div');
        item.className = 'caption-item';

        const number = document.createElement('div');
        number.className = 'caption-number';
        number.textContent = String(index + 1);

        const content = document.createElement('div');
        const tag = document.createElement('span');
        tag.className = 'caption-tag';
        tag.textContent = LABELS[index] || 'CAPTION';
        const text = document.createElement('div');
        text.className = 'caption-text';
        text.textContent = caption;
        content.append(tag, text);

        const copy = document.createElement('button');
        copy.className = 'copy-btn';
        copy.type = 'button';
        copy.title = 'Salin caption';
        copy.setAttribute('aria-label', `Salin caption ${index + 1}`);
        copy.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.7"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
        copy.addEventListener('click', () => copyText(caption, copy));

        item.append(number, content, copy);
        captionsList.appendChild(item);
      });

      resultsBadge.textContent = `${captions.length} caption`;
      captionsList.classList.add('visible');
    }

    async function copyText(text, button) {
      try {
        await navigator.clipboard.writeText(text);
      } catch (_) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
      }

      button.classList.add('copied');
      button.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>';
      setTimeout(() => {
        button.classList.remove('copied');
        button.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.7"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
      }, 1400);
    }

    generateBtn.addEventListener('click', async () => {
      if (!imageBase64) return;
      generateBtn.disabled = true;
      showLoading();

      try {
        const response = await fetch(API_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ imageBase64, imageType, lang: selectedLang })
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
        if (!Array.isArray(data.captions) || data.captions.length === 0) {
          throw new Error('Hasil caption kosong. Coba generate ulang.');
        }
        showCaptions(data.captions);
      } catch (error) {
        showError('Gagal generate: ' + error.message);
      } finally {
        generateBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
